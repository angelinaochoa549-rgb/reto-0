{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-art"><span>✳</span><p>Un lugar para<br>tus recetas de<br><em>siempre.</em></p></div>
  <div class="auth-panel">
    <span class="eyebrow"><span class="eyebrow-line"></span> HAZTE UN LUGAR</span>
    <h1>La mesa es<br><em>para todos.</em></h1>
    <p class="auth-intro">Crea tu cuenta y comparte lo que cocinas.</p>
    <form class="form-stack" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" required value="{{ request.form.get('username', '') }}">
      <label for="password">Contraseña <span class="label-note">8 caracteres como mínimo</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="button button-dark button-wide" type="submit">Crear mi cuenta <span>→</span></button>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
  </div>
</section>
{% endblock %}
