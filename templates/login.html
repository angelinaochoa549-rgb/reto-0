{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-art"><span>✳</span><p>La cocina sabe<br>mejor cuando<br>se comparte.</p></div>
  <div class="auth-panel">
    <span class="eyebrow"><span class="eyebrow-line"></span> QUÉ BUENO VERTE</span>
    <h1>Bienvenida<br><em>de vuelta.</em></h1>
    <p class="auth-intro">Entra y encuentra algo rico para preparar.</p>
    <form class="form-stack" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" autocomplete="username" required value="{{ request.form.get('username', '') }}">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-dark button-wide" type="submit">Iniciar sesión <span>→</span></button>
    </form>
    <p class="auth-switch">¿Aún no tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
  </div>
</section>
{% endblock %}
